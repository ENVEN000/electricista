<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Sala técnica de centro de datos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101c33"/>
      <stop offset="1" stop-color="#0a1222"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18284a"/>
      <stop offset="1" stop-color="#0d1730"/>
    </linearGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fb6ff" stop-opacity=".0"/>
      <stop offset="1" stop-color="#1fb6ff" stop-opacity=".28"/>
    </linearGradient>
    <style>
      .led{animation:b 2s infinite}.l2{animation-delay:.7s}.l3{animation-delay:1.2s}
      @keyframes b{0%,100%{opacity:1}50%{opacity:.25}}
    </style>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- piso técnico -->
  <path d="M0 290L640 290L640 400L0 400Z" fill="url(#floor)"/>
  <g stroke="#2b4373" stroke-width="1" opacity=".6">
    <path d="M0 310H640M0 335H640M0 365H640"/>
    <path d="M80 290L20 400M200 290L170 400M320 290V400M440 290L470 400M560 290L620 400"/>
  </g>

  <!-- bandeja de cables superior -->
  <rect x="30" y="52" width="580" height="14" rx="3" fill="#2b3f66" stroke="#4a6aa3"/>
  <g stroke="#1fb6ff" stroke-width="3" opacity=".85"><path d="M40 59H600"/></g>
  <g stroke="#22d3a6" stroke-width="3" opacity=".85"><path d="M40 63H600"/></g>
  <g stroke="#4a6aa3" stroke-width="2"><path d="M110 66V92M260 66V92M420 66V92M550 66V92"/></g>

  <!-- pasillo frío (azul) -->
  <rect x="215" y="88" width="210" height="202" fill="url(#cold)"/>
  <text x="320" y="110" text-anchor="middle" fill="#1fb6ff" font-family="monospace" font-size="12" letter-spacing="2">PASILLO FRÍO</text>
  <g stroke="#1fb6ff" stroke-width="2" stroke-linecap="round" opacity=".7">
    <path d="M250 300V260M290 300V250M350 300V250M390 300V260"/>
  </g>

  <!-- racks -->
  <g stroke="#3b5a97" stroke-width="1.5">
    <g>
      <rect x="40" y="92" width="80" height="198" rx="5" fill="#16264a"/>
      <rect x="130" y="92" width="80" height="198" rx="5" fill="#16264a"/>
    </g>
    <g>
      <rect x="430" y="92" width="80" height="198" rx="5" fill="#16264a"/>
      <rect x="520" y="92" width="80" height="198" rx="5" fill="#16264a"/>
    </g>
  </g>
  <g fill="#0d1a35" stroke="#33508a" stroke-width="1">
    <path d="M48 102h64v16H48zM48 124h64v16H48zM48 146h64v16H48zM48 168h64v16H48zM48 190h64v16H48zM48 212h64v16H48zM48 234h64v16H48z"/>
    <path d="M138 102h64v16h-64zM138 124h64v16h-64zM138 146h64v16h-64zM138 168h64v16h-64zM138 190h64v16h-64zM138 212h64v16h-64zM138 234h64v16h-64z"/>
    <path d="M438 102h64v16h-64zM438 124h64v16h-64zM438 146h64v16h-64zM438 168h64v16h-64zM438 190h64v16h-64zM438 212h64v16h-64zM438 234h64v16h-64z"/>
    <path d="M528 102h64v16h-64zM528 124h64v16h-64zM528 146h64v16h-64zM528 168h64v16h-64zM528 190h64v16h-64zM528 212h64v16h-64zM528 234h64v16h-64z"/>
  </g>
  <g>
    <circle class="led" cx="56" cy="110" r="2.5" fill="#22d3a6"/><circle class="led l2" cx="56" cy="154" r="2.5" fill="#1fb6ff"/>
    <circle class="led l3" cx="56" cy="198" r="2.5" fill="#22d3a6"/><circle class="led" cx="56" cy="242" r="2.5" fill="#ffb547"/>
    <circle class="led l2" cx="146" cy="132" r="2.5" fill="#22d3a6"/><circle class="led l3" cx="146" cy="176" r="2.5" fill="#1fb6ff"/>
    <circle class="led" cx="146" cy="220" r="2.5" fill="#22d3a6"/>
    <circle class="led l3" cx="446" cy="110" r="2.5" fill="#1fb6ff"/><circle class="led" cx="446" cy="154" r="2.5" fill="#22d3a6"/>
    <circle class="led l2" cx="446" cy="198" r="2.5" fill="#22d3a6"/>
    <circle class="led" cx="536" cy="132" r="2.5" fill="#22d3a6"/><circle class="led l2" cx="536" cy="176" r="2.5" fill="#ffb547"/>
    <circle class="led l3" cx="536" cy="242" r="2.5" fill="#1fb6ff"/>
  </g>
  <!-- cableado vertical -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <path d="M110 66V100" stroke="#1fb6ff"/><path d="M200 66V100" stroke="#22d3a6"/>
    <path d="M440 66V100" stroke="#22d3a6"/><path d="M590 66V100" stroke="#1fb6ff"/>
  </g>

  <!-- unidad de refrigeración (izq. fondo) y UPS -->
  <g transform="translate(236 240)">
    <rect width="70" height="50" rx="5" fill="#1b3a66" stroke="#1fb6ff"/>
    <circle cx="35" cy="25" r="16" fill="none" stroke="#1fb6ff" stroke-width="2"/>
    <path d="M35 25V11M35 25l12 7M35 25l-12 7" stroke="#1fb6ff" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 35 25" to="360 35 25" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="271" y="236" text-anchor="middle" fill="#9fb0cf" font-family="monospace" font-size="10">CRAC</text>

  <g transform="translate(334 240)">
    <rect width="70" height="50" rx="5" fill="#3a2f17" stroke="#ffb547"/>
    <path d="M38 10l-12 18h9l-3 14 14-19h-9l1-13z" fill="#ffb547"/>
  </g>
  <text x="369" y="236" text-anchor="middle" fill="#9fb0cf" font-family="monospace" font-size="10">UPS</text>

  <!-- etiquetas -->
  <g font-family="monospace" font-size="11" fill="#9fb0cf">
    <text x="40" y="84">RACKS A</text>
    <text x="520" y="84">RACKS B</text>
    <text x="36" y="46" fill="#1fb6ff">▬ Fibra OS2</text>
    <text x="140" y="46" fill="#22d3a6">▬ Cobre Cat6A</text>
  </g>
</svg>
