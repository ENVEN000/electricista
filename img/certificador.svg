<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" role="img" aria-label="Ilustración de un certificador de cableado conectado a un patch panel">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2c4d"/><stop offset="1" stop-color="#0f1a2e"/></linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1830"/><stop offset="1" stop-color="#07101f"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1fb6ff"/><stop offset="1" stop-color="#22d3a6"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1fb6ff" stop-opacity=".3"/><stop offset="1" stop-color="#1fb6ff" stop-opacity="0"/></radialGradient>
    <style>.blink{animation:b 2s infinite}@keyframes b{0%,100%{opacity:1}50%{opacity:.3}}</style>
  </defs>
  <ellipse cx="260" cy="210" rx="250" ry="200" fill="url(#glow)"/>
  <!-- patch panel -->
  <rect x="20" y="30" width="480" height="62" rx="8" fill="url(#body)" stroke="#2a4a7a" stroke-width="1.5"/>
  <g fill="#07101f" stroke="#3b5f93">
    <rect x="34" y="46" width="24" height="26" rx="3"/><rect x="64" y="46" width="24" height="26" rx="3"/><rect x="94" y="46" width="24" height="26" rx="3"/><rect x="124" y="46" width="24" height="26" rx="3"/>
    <rect x="154" y="46" width="24" height="26" rx="3"/><rect x="184" y="46" width="24" height="26" rx="3"/><rect x="214" y="46" width="24" height="26" rx="3"/><rect x="244" y="46" width="24" height="26" rx="3"/>
    <rect x="274" y="46" width="24" height="26" rx="3"/><rect x="304" y="46" width="24" height="26" rx="3"/><rect x="334" y="46" width="24" height="26" rx="3"/><rect x="364" y="46" width="24" height="26" rx="3"/>
    <rect x="394" y="46" width="24" height="26" rx="3"/><rect x="424" y="46" width="24" height="26" rx="3"/><rect x="454" y="46" width="24" height="26" rx="3"/>
  </g>
  <g font-family="monospace" font-size="8" fill="#9fb0cf" text-anchor="middle">
    <text x="46" y="84">01</text><text x="76" y="84">02</text><text x="106" y="84">03</text><text x="136" y="84">04</text><text x="166" y="84">05</text>
  </g>
  <!-- cordones -->
  <path d="M196 72 C196 140 150 150 150 215" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>
  <path d="M226 72 C226 150 360 130 360 215" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
  <!-- unidad principal -->
  <rect x="90" y="210" width="190" height="190" rx="22" fill="url(#body)" stroke="#2a4a7a" stroke-width="2"/>
  <rect x="104" y="226" width="162" height="116" rx="12" fill="url(#scr)" stroke="#3b5f93"/>
  <rect x="116" y="238" width="62" height="28" rx="6" fill="#22d3a6"/>
  <text x="147" y="258" text-anchor="middle" font-family="monospace" font-weight="700" font-size="16" fill="#04201a">PASS</text>
  <g font-family="monospace" font-size="9" fill="#9fb0cf">
    <text x="190" y="248">Cat 6A · Perm. link</text>
    <text x="190" y="262" fill="#22d3a6">Margen: +4.2 dB</text>
    <text x="116" y="286">Mapa de cableado</text><text x="226" y="286" fill="#22d3a6">OK</text>
    <text x="116" y="302">Longitud</text><text x="226" y="302" fill="#22d3a6">OK</text>
    <text x="116" y="318">NEXT</text><text x="226" y="318" fill="#22d3a6">OK</text>
    <text x="116" y="334">Return loss</text><text x="226" y="334" fill="#22d3a6">OK</text>
  </g>
  <circle class="blink" cx="124" cy="366" r="5" fill="#22d3a6"/>
  <rect x="146" y="358" width="40" height="16" rx="8" fill="#16233d" stroke="#3b5f93"/>
  <rect x="196" y="358" width="40" height="16" rx="8" fill="#16233d" stroke="#3b5f93"/>
  <!-- unidad remota -->
  <rect x="320" y="215" width="120" height="150" rx="18" fill="url(#body)" stroke="#2a4a7a" stroke-width="2"/>
  <rect x="332" y="229" width="96" height="52" rx="8" fill="url(#scr)" stroke="#3b5f93"/>
  <text x="380" y="260" text-anchor="middle" font-family="monospace" font-size="11" fill="#1fb6ff">REMOTO</text>
  <circle class="blink" cx="352" cy="306" r="5" fill="#22d3a6"/><circle cx="380" cy="306" r="5" fill="#1fb6ff"/><circle cx="408" cy="306" r="5" fill="#2a4a7a"/>
  <rect x="340" y="328" width="80" height="18" rx="9" fill="#16233d" stroke="#3b5f93"/>
</svg>
