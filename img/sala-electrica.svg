<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Sala eléctrica con tableros, transformador, planta de emergencia y bandeja portacables">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e110d"/>
      <stop offset="1" stop-color="#120a08"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1a13"/>
      <stop offset="1" stop-color="#170d0a"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity=".26"/>
    </linearGradient>
    <style>
      .led{animation:b 2s infinite}.l2{animation-delay:.7s}.l3{animation-delay:1.2s}
      @keyframes b{0%,100%{opacity:1}50%{opacity:.25}}
    </style>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- piso -->
  <path d="M0 290L640 290L640 400L0 400Z" fill="url(#floor)"/>
  <g stroke="#5a3425" stroke-width="1" opacity=".6">
    <path d="M0 310H640M0 335H640M0 365H640"/>
    <path d="M80 290L20 400M200 290L170 400M320 290V400M440 290L470 400M560 290L620 400"/>
  </g>
  <!-- barra de tierra -->
  <path d="M20 384H620" stroke="#5fd38d" stroke-width="3" stroke-dasharray="14 6" opacity=".8"/>

  <!-- bandeja portacables -->
  <rect x="30" y="52" width="580" height="14" rx="3" fill="#4a2a1f" stroke="#8a4a30"/>
  <g stroke="#ff7a1a" stroke-width="3" opacity=".9"><path d="M40 59H600"/></g>
  <g stroke="#ffb02e" stroke-width="3" opacity=".9"><path d="M40 63H600"/></g>
  <g stroke="#8a4a30" stroke-width="2"><path d="M110 66V92M260 66V92M420 66V92M550 66V92"/></g>

  <!-- zona central iluminada -->
  <rect x="215" y="88" width="210" height="202" fill="url(#warm)"/>
  <text x="320" y="110" text-anchor="middle" fill="#ff7a1a" font-family="monospace" font-size="12" letter-spacing="2">ZONA DE POTENCIA</text>

  <!-- tableros -->
  <g stroke="#8a4a30" stroke-width="1.5">
    <rect x="40" y="92" width="80" height="198" rx="5" fill="#2a1710"/>
    <rect x="130" y="92" width="80" height="198" rx="5" fill="#2a1710"/>
    <rect x="430" y="92" width="80" height="198" rx="5" fill="#2a1710"/>
    <rect x="520" y="92" width="80" height="198" rx="5" fill="#2a1710"/>
  </g>
  <!-- breakers en tableros -->
  <g fill="#120a08" stroke="#6b3a28" stroke-width="1">
    <path d="M48 102h28v14H48zM84 102h28v14H84zM48 122h28v14H48zM84 122h28v14H84zM48 142h28v14H48zM84 142h28v14H84zM48 162h28v14H48zM84 162h28v14H84z"/>
    <path d="M138 102h28v14h-28zM174 102h28v14h-28zM138 122h28v14h-28zM174 122h28v14h-28zM138 142h28v14h-28zM174 142h28v14h-28zM138 162h28v14h-28zM174 162h28v14h-28z"/>
    <path d="M438 102h28v14h-28zM474 102h28v14h-28zM438 122h28v14h-28zM474 122h28v14h-28zM438 142h28v14h-28zM474 142h28v14h-28zM438 162h28v14h-28zM474 162h28v14h-28z"/>
    <path d="M528 102h28v14h-28zM564 102h28v14h-28zM528 122h28v14h-28zM564 122h28v14h-28zM528 142h28v14h-28zM564 142h28v14h-28zM528 162h28v14h-28zM564 162h28v14h-28z"/>
  </g>
  <g fill="#ff7a1a">
    <rect x="50" y="104" width="24" height="5" rx="1"/><rect x="86" y="124" width="24" height="5" rx="1"/><rect x="50" y="144" width="24" height="5" rx="1"/><rect x="86" y="164" width="24" height="5" rx="1"/>
    <rect x="140" y="104" width="24" height="5" rx="1"/><rect x="176" y="104" width="24" height="5" rx="1"/><rect x="140" y="144" width="24" height="5" rx="1"/><rect x="176" y="144" width="24" height="5" rx="1"/>
    <rect x="440" y="124" width="24" height="5" rx="1"/><rect x="476" y="104" width="24" height="5" rx="1"/><rect x="440" y="164" width="24" height="5" rx="1"/><rect x="476" y="144" width="24" height="5" rx="1"/>
    <rect x="530" y="104" width="24" height="5" rx="1"/><rect x="566" y="124" width="24" height="5" rx="1"/><rect x="530" y="144" width="24" height="5" rx="1"/><rect x="566" y="164" width="24" height="5" rx="1"/>
  </g>
  <!-- medidores -->
  <g fill="#120a08" stroke="#ffb02e" stroke-width="1.5">
    <circle cx="80" cy="222" r="22"/><circle cx="170" cy="222" r="22"/><circle cx="470" cy="222" r="22"/><circle cx="560" cy="222" r="22"/>
  </g>
  <g stroke="#ff4a2e" stroke-width="2.5" stroke-linecap="round">
    <path d="M80 222l12-12"/><path d="M170 222l-10-13"/><path d="M470 222l13-8"/><path d="M560 222l-8-14"/>
  </g>
  <g>
    <circle class="led" cx="56" cy="262" r="2.5" fill="#5fd38d"/><circle class="led l2" cx="146" cy="262" r="2.5" fill="#ffb02e"/>
    <circle class="led l3" cx="446" cy="262" r="2.5" fill="#5fd38d"/><circle class="led" cx="536" cy="262" r="2.5" fill="#ff4a2e"/>
  </g>
  <!-- conductores verticales -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <path d="M110 66V100" stroke="#ff7a1a"/><path d="M200 66V100" stroke="#ffb02e"/>
    <path d="M440 66V100" stroke="#ffb02e"/><path d="M590 66V100" stroke="#ff7a1a"/>
  </g>

  <!-- transformador -->
  <g transform="translate(236 240)">
    <rect width="70" height="50" rx="5" fill="#4a2410" stroke="#ff7a1a"/>
    <g stroke="#ff7a1a" stroke-width="2.5" stroke-linecap="round"><path d="M14 8v34M26 8v34M38 8v34M50 8v34"/></g>
    <circle cx="14" cy="6" r="3" fill="#ffb02e"/><circle cx="35" cy="6" r="3" fill="#ffb02e"/><circle cx="56" cy="6" r="3" fill="#ffb02e"/>
  </g>
  <text x="271" y="236" text-anchor="middle" fill="#c9a99b" font-family="monospace" font-size="10">TRAFO</text>

  <!-- planta de emergencia -->
  <g transform="translate(334 240)">
    <rect width="70" height="50" rx="5" fill="#3a1410" stroke="#e8341c"/>
    <path d="M38 10l-12 18h9l-3 14 14-19h-9l1-13z" fill="#ffb02e"/>
  </g>
  <text x="369" y="236" text-anchor="middle" fill="#c9a99b" font-family="monospace" font-size="10">PLANTA</text>

  <!-- etiquetas -->
  <g font-family="monospace" font-size="11" fill="#c9a99b">
    <text x="40" y="84">TABLEROS A</text>
    <text x="500" y="84">TABLEROS B</text>
    <text x="36" y="46" fill="#ff7a1a">▬ Fase / Neutro</text>
    <text x="160" y="46" fill="#ffb02e">▬ Control</text>
    <text x="40" y="378" fill="#5fd38d">▬ Puesta a tierra</text>
  </g>
</svg>
